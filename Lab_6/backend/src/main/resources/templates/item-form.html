<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Форма об'єкта</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/items">🌌 Космічний Адмін-Центр</a>
    </div>
</nav>

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="${item.id == null} ? '🌌 Додати новий космічний об\'єкт' : '✏️ Редагувати об\'єкт'">Форма</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/items/save}" th:object="${item}" method="post">

                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label for="name" class="form-label">Назва космічного об'єкта:</label>
                    <input type="text" th:field="*{name}" id="name" class="form-control" placeholder="Наприклад: Сатурн" required>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Науковий опис:</label>
                    <textarea th:field="*{description}" id="description" class="form-control" rows="4" placeholder="Опишіть характеристики об'єкта..." required></textarea>
                </div>

                <div class="mb-3">
                    <label for="imageUrl" class="form-label">Посилання на зображення (URL):</label>
                    <input type="url" th:field="*{imageUrl}" id="imageUrl" class="form-control" placeholder="https://example.com/image.jpg" required>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="/items" class="btn btn-outline-secondary">Скасувати</a>
                    <button type="submit" class="btn btn-success">💾 Зберегти у БД</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
