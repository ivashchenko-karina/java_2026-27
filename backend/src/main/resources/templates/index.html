<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Адміністрування: Космічний Портал</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/items">🌌 Космічний Адмін-Центр</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4 p-4 rounded-3 custom-card shadow-sm">
        <div>
            <h2 class="mb-1 text-white">Список космічних об'єктів</h2>
            <small class="text-muted">Система керування базою даних PostgreSQL</small>
        </div>
        <a href="/items/new" class="btn btn-success fw-bold shadow-sm px-4">➕ Додати новий об'єкт</a>
    </div>

    <div class="table-responsive shadow rounded-3">
        <table class="table table-dark table-striped table-hover align-middle mb-0">
            <thead class="table-active text-white">
            <tr>
                <th class="py-3 px-4" style="width: 80px;">ID</th>
                <th class="py-3" style="width: 120px;">Зображення</th>
                <th class="py-3" style="width: 200px;">Назва об'єкта</th>
                <th class="py-3">Опис</th>
                <th class="py-3 text-center" style="width: 260px;">Дії з даними</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.id}" class="px-4 fw-bold text-info">1</td>
                <td>
                    <img th:src="${item.imageUrl}" th:alt="${item.name}"
                         class="img-fluid rounded cosmic-img border border-secondary shadow-sm"
                         style="width: 90px; height: 55px; object-fit: cover;">
                </td>
                <td>
                    <span th:text="${item.name}" class="fw-bold text-white fs-5">Назва</span>
                </td>
                <td>
                    <p th:text="${item.description}" class="text-white-50 small mb-0 lh-base">Опис об'єкта...</p>
                </td>
                <td class="text-center">
                    <a th:href="@{/items/edit/{id}(id=${item.id})}" class="btn btn-primary btn-sm px-3 me-2 fw-bold shadow-sm">✏️ Редагувати</a>
                    <a th:href="@{/items/delete/{id}(id=${item.id})}" class="btn btn-danger btn-sm px-3 fw-bold shadow-sm"
                       onclick="return confirm('Ви впевнені, що хочете видалити цей космічний об\'єкт?')">❌ Видалити</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(items)}">
                <td colspan="5" class="text-center text-muted py-5 fs-5">
                    🛸 Космічний простір порожній. Додайте першу планету!
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
