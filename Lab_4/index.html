<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Космічний Портал</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0b0f19; color: #fff; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #6366f1; margin-bottom: 30px; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .card { background: #1e293b; border-radius: 12px; width: 300px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-content { padding: 15px; }
        .card-title { font-size: 1.3rem; margin: 0 0 10px 0; color: #38bdf8; }
        .card-desc { font-size: 0.95rem; color: #cbd5e1; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="app">
        <h1>🌌 Портал про космос і астрономію</h1>
        
        <div class="container">
            <div class="card" v-for="item in items" :key="item.id">
                <img :src="item.imageUrl" :alt="item.name">
                <div class="card-content">
                    <h2 class="card-title">{{ item.name }}</h2>
                    <p class="card-desc">{{ item.description }}</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const items = ref([]);

                onMounted(() => {
                    axios.get('http://localhost:8080/api/items')
                        .then(response => {
                            items.value = response.data;
                        })
                        .catch(error => {
                            console.error("Помилка завантаження даних:", error);
                        });
                });

                return { items };
            }
        }).mount('#app');
    </script>
</body>
</html>
